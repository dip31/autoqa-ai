name: AutoQA ZAP Baseline Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "HTTPS URL of the authorized target to scan"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep the application default (disabled) unchanged
      ZAP_ENABLED: "false"
    steps:
      # --------------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # --------------------------------------------------------------
      # 2. Set up Python and install backend dependencies
      # --------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.2.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./autoqa-ai/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------------
      # 3. Run existing backend test suite
      # --------------------------------------------------------------
      - name: Run backend tests
        working-directory: ./autoqa-ai/backend
        run: |
          python -m pytest tests -q --maxfail=5 --disable-warnings

      # --------------------------------------------------------------
      # 4. Basic validation of the supplied target URL (HTTPS only)
      # --------------------------------------------------------------
      - name: Validate target URL
        id: validate-url
        run: |
          url="${{ github.event.inputs.target_url }}"
          if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/.*)?$ ]]; then
            echo "::error::Invalid target URL – must be an HTTPS URL (e.g. https://example.com)"
            exit 1
          fi
          # Additional safety: reject private / loopback ranges
          host=$(echo "$url" | sed -E 's|^https://([^:/]+).*|\1|')
          if [[ "$host" =~ ^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|169\.254\.|::1|fd[0-9a-f]{2}:) ]]; then
            echo "::error::Scanning private, loopback, or link‑local addresses is not allowed"
            exit 1
          fi
          echo "url=$url" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 5. OWASP ZAP Baseline scan (official action, pinned to commit SHA)
      # --------------------------------------------------------------
      - name: ZAP Baseline Scan
        id: zap-scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: ${{ steps.validate-url.outputs.url }}
          # Do not fail the workflow on findings; we only want the reports
          fail_action: "false"
          # Do not create/update a GitHub issue automatically
          allow_issue_writing: "false"
          # Give the artifact a stable name that includes the run id
          artifact_name: "zap-report-${{ github.run_id }}"

      # --------------------------------------------------------------
      # 6. Upload the generated HTML & JSON reports as separate artifacts
      #    (the action already publishes an artifact, but we also expose them
      #    explicitly for easier download)
      # --------------------------------------------------------------
      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-html-report-${{ github.run_id }}
          path: zap-report-${{ github.run_id }}/report.html
          retention-days: 14

      - name: Upload ZAP JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-json-report-${{ github.run_id }}
          path: zap-report-${{ github.run_id }}/report.json
          retention-days: 14

      # --------------------------------------------------------------
      # 7. Summarise outcome
      # --------------------------------------------------------------
      - name: Scan outcome summary
        if: always()
        run: |
          if [[ "${{ steps.zap-scan.outcome }}" == "success" ]]; then
            echo "✅ ZAP baseline scan completed – reports uploaded as artifacts."
          else
            echo "❌ ZAP baseline scan failed – see logs for details."
            exit 1
          fi